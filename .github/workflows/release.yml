name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Verify source, tag, and release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = metadata["project"]
          version = Version(project["version"])
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          is_prerelease = os.environ["RELEASE_IS_PRERELEASE"].casefold() == "true"

          if project["name"] != "agentforge-secure":
              raise SystemExit("Unexpected PyPI distribution name")
          if release_tag != expected_tag:
              raise SystemExit(f"Release tag {release_tag!r} must equal {expected_tag!r}")
          if version.is_prerelease != is_prerelease:
              raise SystemExit("GitHub pre-release flag does not match the package version")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata and README rendering
        run: python -m twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          test "$(.release-venv/bin/agentforge version)" = "${GITHUB_REF_NAME#v}"
          .release-venv/bin/python -m pip check

      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/agentforge-secure
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
