[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "agentforge-secure"
version = "0.1.0a1"
description = "An extensible, security-aware AI agent framework with Skills and Plugins."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "wanhaoli376-lab" }]
keywords = ["ai-agent", "automation", "cli", "plugins", "security", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "httpx>=0.27,<1",
  "openai>=2.53.0,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.3,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
agentforge = "agentforge.cli:app"

[project.urls]
Changelog = "https://github.com/wanhaoli376-lab/AgentForge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/wanhaoli376-lab/AgentForge#readme"
Issues = "https://github.com/wanhaoli376-lab/AgentForge/issues"
Repository = "https://github.com/wanhaoli376-lab/AgentForge"
Security = "https://github.com/wanhaoli376-lab/AgentForge/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "agentforge/builtin_skills"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/src",
  "/skills",
  "/tests",
  "/docs",
  "/examples",
  "/agentforge.example.yaml",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentforge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentforge"]
